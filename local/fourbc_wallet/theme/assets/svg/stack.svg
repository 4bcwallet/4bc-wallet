<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Welcome picture: the sign, lit by the light at the end of its line, resting above its own soft shadow.
       Safe cut for flutter_svg: filled shapes and gradients only, no stroke anywhere.
       The light and the shadow are radial gradients, not blur. -->
  <defs>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="458" cy="288" r="150">
      <stop offset="0" stop-color="#FFC93C" stop-opacity="0.38"/>
      <stop offset="0.2" stop-color="#FFC93C" stop-opacity="0.247"/>
      <stop offset="0.4" stop-color="#FFC93C" stop-opacity="0.129"/>
      <stop offset="0.6" stop-color="#FFC93C" stop-opacity="0.051"/>
      <stop offset="0.8" stop-color="#FFC93C" stop-opacity="0.013"/>
      <stop offset="1" stop-color="#FFC93C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lift" gradientUnits="userSpaceOnUse" cx="256" cy="262" r="330">
      <stop offset="0" stop-color="#D9DADC" stop-opacity="0.075"/>
      <stop offset="0.2" stop-color="#D9DADC" stop-opacity="0.049"/>
      <stop offset="0.4" stop-color="#D9DADC" stop-opacity="0.026"/>
      <stop offset="0.6" stop-color="#D9DADC" stop-opacity="0.010"/>
      <stop offset="0.8" stop-color="#D9DADC" stop-opacity="0.003"/>
      <stop offset="1" stop-color="#D9DADC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#17181B" stop-opacity="0.50"/>
      <stop offset="0.2" stop-color="#17181B" stop-opacity="0.325"/>
      <stop offset="0.4" stop-color="#17181B" stop-opacity="0.17"/>
      <stop offset="0.6" stop-color="#17181B" stop-opacity="0.068"/>
      <stop offset="0.8" stop-color="#17181B" stop-opacity="0.017"/>
      <stop offset="1" stop-color="#17181B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC93C" stop-opacity="0.16"/>
      <stop offset="0.2" stop-color="#FFC93C" stop-opacity="0.104"/>
      <stop offset="0.4" stop-color="#FFC93C" stop-opacity="0.054"/>
      <stop offset="0.6" stop-color="#FFC93C" stop-opacity="0.022"/>
      <stop offset="0.8" stop-color="#FFC93C" stop-opacity="0.005"/>
      <stop offset="1" stop-color="#FFC93C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="light" gradientUnits="userSpaceOnUse" x1="474.6" y1="298.6" x2="376.5" y2="295.2">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="0.28" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#D7D8DA"/>
    </linearGradient>
    <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="0" y1="87" x2="0" y2="425">
      <stop offset="0" stop-color="#E9EAEC"/>
      <stop offset="1" stop-color="#CBCCCF"/>
    </linearGradient>
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" y1="293" x2="0" y2="315">
      <stop offset="0" stop-color="#2B2D31" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2B2D31" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(62 44) scale(0.9)">
    <circle cx="256" cy="262" r="330" fill="url(#lift)"/>
    <ellipse cx="262" cy="524" rx="270" ry="40" fill="url(#floor)"/>
    <ellipse cx="436" cy="524" rx="130" ry="22" fill="url(#spill)"/>
    <circle cx="458" cy="288" r="150" fill="url(#glow)"/>
    <!-- The sign as filled outlines: no stroke is used, so no stroke join can be drawn wrongly.
         Each piece carries the same silver gradient in user space, so the pieces show no seam. -->
    <g fill="url(#silver)">
      <!-- the 4b line: stem, diagonal, bar, bowl, and the round ends at the apex and at the bar's left end -->
      <rect x="142" y="105" width="36" height="240"/>
      <path d="M174.62 115.49L52.62 285.49L23.38 264.51L145.38 94.51Z"/>
      <rect x="38" y="257" width="192" height="36"/>
      <path d="M226 257A84 84 0 1 1 142 341L178 341A48 48 0 1 0 226 293Z"/>
      <circle cx="160" cy="105" r="18"/>
      <circle cx="38" cy="275" r="18"/>
      <!-- the c, with its round lower end -->
      <path d="M367.8 278.6A84 84 0 1 0 488.4 395L460.8 371.9A48 48 0 1 1 391.9 305.3Z"/>
      <circle cx="474.6" cy="383.4" r="18"/>
    </g>
    <!-- the lit end of the c -->
    <path fill="url(#light)" d="M488.4 287A84 84 0 0 0 363.6 282.7L389.5 307.7A48 48 0 0 1 460.8 310.2Z"/>
    <circle cx="474.6" cy="298.6" r="18" fill="#FFC93C"/>
    <rect x="142" y="293" width="36" height="22" fill="url(#shade)"/>
  </g>
</svg>
